}

 let bx=W*.42,by=H*.58-95,vx=speed*.9+95;
 rag=[
  {x:bx,y:by,px:bx-vx*.01,py:by+2,r:12},
  {x:bx,y:by+24,px:bx-vx*.01,py:by+25,r:8},
  {x:bx-18,y:by+38,px:bx-18-vx*.01,py:by+39,r:7},
  {x:bx+18,y:by+38,px:bx+18-vx*.01,py:by+39,r:7},

const ragLinks=[[0,1,25],[1,2,24],[1,3,24],[1,4,40],[1,5,40],[4,5,24]];
function drawRagdoll(dt){
 if(!crashed)return;crashT+=dt;let ground=H*.58-8;
 for(let p of rag){let vx=(p.x-p.px)*.985,vy=(p.y-p.py)*.985;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+520*dt*dt;if(p.y>ground){p.y=ground;p.py=p.y+(p.y-p.py)*.25}}
 for(let iter=0;iter<5;iter++)for(let L of ragLinks){let a=rag[L[0]],b=rag[L[1]],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,err=(d-L[2])/d*.5,ox=dx*err,oy=dy*err;a.x+=ox;a.y+=oy;b.x-=ox;b.y-=oy}
 g.strokeStyle='#20242a';g.lineWidth=9;g.lineCap='round';
 for(let L of ragLinks){let a=rag[L[0]],b=rag[L[1]];g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}
 for(let i=0;i<rag.length;i++){let p=rag[i];g.fillStyle=i===0?'#17191d':'#20242a';g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.fill()}
}
function loop(t){
 // Safari-proof selector sync: visible menu value is the source of truth.
 let menuIdx=Number(S.value);
 if(Number.isFinite(menuIdx)&&menuIdx!==idx)syncRideFromMenu();
 throttle=Math.max(0,Math.min(1,(+document.querySelector('#throttle').value||0)/100));
 document.querySelector('#throttlePct').textContent=Math.round(throttle*100)+'%';
 let dt=Math.min(.025,(t-last)/1000);last=t;let r=R(),bike=r.t==='DIRT BIKE'||r.t==='SPORT BIKE',carType=r.t==='SPORT CAR';
 if(bike&&started)temp=Math.min(110,temp+dt*((choke?7:2.2)+throttle*2.8));
 if(!crashed){
   let running=!bike||started,acc=0;
   if(running){
     if(bike){
       let caps=[0,.24,.40,.57,.73,.87,1],cap=r.max*(caps[gear]||0);
       if(started&&gear>0&&throttle>.001){
         let ccv=ccNum(r);
         let punch=ccv<=85?2.4:ccv<=150?2.8:ccv<=250?3.2:ccv<=500?3.7:4.0;
         let targetSpeed=Math.max(2,cap*(.10+.90*throttle));
         acc=(targetSpeed-speed)*punch;
         // minimum positive drive guarantees the bike moves from rest.
         if(speed<targetSpeed&&acc<12)acc=12;
       }else acc=0;
       if(clutchSlip>0)clutchSlip=Math.max(0,clutchSlip-dt);
     }else if(carType){
       let caps=[0,.22,.38,.55,.71,.86,1],cap=r.max*(caps[gear]||.10);
       let boostSpool=Math.min(1,Math.max(.22,(rpm-1600)/3200))*throttle;
       acc=throttle*(62+boostPsi*1.8)*([0,1.45,1.22,1.05,.91,.81,.73][gear]||0)*boostSpool;
       if(speed>cap)acc-=Math.min(75,(speed-cap)*9);
     }else if(r.t==='TUNED QUAD')acc=throttle*62;
     else acc=throttle*45;
   }
   let drag=(speed>0?.8:0)+speed*speed*.00038;
   speed+=(acc-drag-(brake?82:0))*dt;speed=Math.max(0,Math.min(r.max,speed));
   dist+=speed*dt/3.6;

   // Real wheelie-style pitch dynamics: torque lifts, gravity restores, brake dives.
   if(bike){
     let speedFactor=Math.min(1,Math.max(0,(speed-4)/28));
     let physicalLift=(gear?throttle:0)*speedFactor*1.18;
     let assistLift=wheelAssist?(gear?throttle:0)*speedFactor*.92*Math.max(0,1-angle/.95):0;
     let torqueLift=physicalLift+assistLift;
     let gravity=1.90*Math.sin(Math.max(0,angle));
     let brakePitch=brake&&speed>4?1.8:0;
     let aero=angleVel*.84;
     angleVel+=(torqueLift-gravity-brakePitch-aero)*dt;
     if(throttle<.03)angleVel-=Math.max(0,angle)*1.7*dt;
     angle+=angleVel*dt;
     if(angle<0){angle=0;if(angleVel<0)angleVel=0}
     if(angle>1.42)crashNow(); // looped past ~81 degrees
   }else{angle+=(0-angle)*5*dt;angleVel=0}
 }
 let sn=stiffness/100,dn=damping/100,travel=9-sn*5;
 let targetF=(brake?travel*.95:0)-throttle*travel*.10,targetR=throttle*travel*.65-(brake?travel*.10:0);
 if(bike&&angle>.18){targetF=-travel*.7;targetR=travel*.8}
 let response=Math.max(1.2,9-sn*3.2-dn*4.4),ease=1-Math.exp(-response*dt);
 suspF+=(targetF-suspF)*ease;suspR+=(targetR-suspR)*ease;suspF=Math.max(-9,Math.min(9,suspF));suspR=Math.max(-9,Math.min(9,suspR));
 let targetPitch=!bike?(brake?.09:-throttle*.055):0,pitchEase=1-Math.exp(-(3.2+dn*2)*dt);chassisPitch+=(targetPitch-chassisPitch)*pitchEase;

 // 125–500cc overrun/backfire: only on a sharp throttle lift at useful RPM.
 if(backfireEligible(r)&&lastThrottle>.55&&throttle<.12&&rpm>4300)backfire(.75+Math.min(1,rpm/9000)*.55);
 lastThrottle=throttle;
 // Sport-car hard RPM cut at the selected limiter.
 if(carType&&rpm>=carRpmLimit-80){if(Math.floor(t/65)%2===0)acc=0;rpm=Math.min(rpm,carRpmLimit);if(throttle>.75&&Math.random()<.045)backfire(.75)}
 scroll+=speed*dt*34;engine();road();let bx=W*.42,by=H*.58-31;
 if(!crashed){
   if(r.t==='DIRT BIKE')dirt(bx,by,r);else if(r.t==='SPORT BIKE')sportBike(bx,by,r);else if(r.t==='TUNED QUAD')quad(bx,by,r);else if(r.t==='SPORT CAR')car(bx,by,r);else ebike(bx,by,r);
 }else drawRagdoll(dt);
 drawExhaust();
 document.querySelector('#stats').innerHTML=`${r.n}<br>${speed.toFixed(0)} MPH • ${Math.round(rpm)} RPM${carType?` • ${Math.round(boostPsi*Math.min(1,Math.max(.18,(rpm-1800)/3500))*throttle)} PSI`:''}`;
 document.querySelector('#status').textContent=crashed?'💥 RIDER DOWN — RESET':(gear?`⚙️ GEAR ${gear}`:'🟢 NEUTRAL');
 document.querySelector('#live').textContent=`ACTIVE: ${r.n} | ${bike?(started?'ENGINE ON':'ENGINE OFF'):'POWER ON'} | GAS ${Math.round(throttle*100)}% | G${gear} | ${speed.toFixed(1)} MPH`;
 document.querySelector('#live').style.color=(bike&&started&&gear>0&&throttle>0)?'#7CFF6B':'#fff';
 update();requestAnimationFrame(loop)
}requestAnimationFrame(loop);
